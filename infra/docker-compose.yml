name: nexus

services:
  postgres:
    image: postgres:17-alpine
    container_name: nexus-postgres
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: postgres
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6381:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    container_name: nexus-nats
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    volumes:
      - natsdata:/data

  minio:
    # Only needed from Phase 7 (files service). Start with:
    #   docker compose -f infra/docker-compose.yml --profile storage up -d
    profiles: ["storage"]
    image: quay.io/minio/minio:latest
    container_name: nexus-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nexus
      MINIO_ROOT_PASSWORD: nexussecret
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: nexus-mailpit
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  redisdata:
  natsdata:
  miniodata:
